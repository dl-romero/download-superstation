name: Docker

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bare-metal tarball
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TARBALL="download-superstation-${{ github.ref_name }}-linux.tar.gz"
          mkdir -p dist/download-superstation
          cp app.py torrent_manager.py requirements.txt install.sh run.sh torrent-webui.service dist/download-superstation/
          cp -r templates static dist/download-superstation/
          mkdir -p dist/download-superstation/scripts
          cp scripts/bare-metal-update.sh dist/download-superstation/scripts/
          chmod +x dist/download-superstation/scripts/bare-metal-update.sh
          mkdir -p dist/download-superstation/systemd
          cp systemd/bare-metal-download-superstation-update.service \
             systemd/bare-metal-download-superstation-update.timer \
             dist/download-superstation/systemd/
          tar -czf "$TARBALL" -C dist download-superstation
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Download Superstation ${{ github.ref_name }}" \
            --generate-notes \
            --notes "## Docker

          Pull the image:
          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          \`\`\`

          Run with Docker Compose:
          \`\`\`bash
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
          docker compose up -d
          \`\`\`

          ## Linux (bare metal)

          Download and extract the release tarball:
          \`\`\`bash
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${TARBALL}
          tar -xzf ${TARBALL}
          cd download-superstation
          sudo bash install.sh
          \`\`\`

          See the [README](https://github.com/${{ github.repository }}#readme) for full documentation." \
            "$TARBALL"
